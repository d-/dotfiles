# Default flags for clang++ when the driver is Homebrew's LLVM (the default
# compiler here; CC/CXX in config.fish point build systems at it). Homebrew
# builds clang with CLANG_CONFIG_FILE_USER_DIR=~/.config/clang; Apple's
# /usr/bin/clang++ and /usr/bin/c++ have no user config dir and ignore this.
# Flags here come first on the command line, so an explicit -std= still wins.
-std=c++23
