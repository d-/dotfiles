# ~/.config/tmux/tmux.conf
#
# NOTE: this previously lived at ~/.config/tmux/.tmux.conf -- with a leading dot
# -- which is not one of the paths tmux searches (~/.tmux.conf,
# $XDG_CONFIG_HOME/tmux/tmux.conf, ~/.config/tmux/tmux.conf). It was never
# loaded. The former ~/.tmux.conf has been merged in here.

# Shell management.

    # Prefer fish explicitly; ${SHELL} is whatever launched the tmux *server*,
    # which is not necessarily the login shell.
    if-shell '[ -x /opt/homebrew/bin/fish ]' 'set -g default-shell /opt/homebrew/bin/fish'
    if-shell '[ ! -x /opt/homebrew/bin/fish ] && [ -x /usr/local/bin/fish ]' 'set -g default-shell /usr/local/bin/fish'
    # No default-command on purpose: tmux then launches default-shell as a login
    # shell. Setting it to "#{default-shell}" does NOT expand -- the literal string
    # fails to exec and the pane dies instantly, taking the session with it.

# Colour management.

    # tmux-256color advertises italics and proper RGB, unlike screen-256color.
    set -g default-terminal "tmux-256color"
    set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc,xterm*:Tc"
    set -ga terminal-features ",alacritty:usstyle"

# General behaviour.

    set -g history-limit 50000        # was 10000
    set -g mouse on
    set -g focus-events on            # keeps vim's FocusGained working
    set -g set-titles on
    set -g set-clipboard on           # OSC 52, so yanks reach the host clipboard
    set -sg escape-time 0             # no lag leaving insert mode in vim
    set -g display-time 2000
    set -g status-keys vi
    setw -g mode-keys vi
    set -g allow-rename off
    set -g base-index 1
    set -g pane-base-index 1
    set -g renumber-windows on
    set -g detach-on-destroy off      # hop to another session instead of exiting

# Alerts.

    setw -g monitor-activity on
    set -g visual-activity off
    set -g visual-silence off
    set -g visual-bell off
    set -g bell-action none

# Configuration management.

    bind R source-file ~/.config/tmux/tmux.conf \; display "Sourced ~/.config/tmux/tmux.conf"

# Nested sessions: ^B b sends the prefix through to an inner tmux.

    bind-key b send-prefix

# Pane and window management.

    bind c new-window -c "#{pane_current_path}"
    bind | split-window -h -c "#{pane_current_path}"
    bind - split-window -v -c "#{pane_current_path}"

    # Swap windows left/right, i.e. move the tabs around.
    bind-key h swap-window -t -1\; select-window -t -1
    bind-key l swap-window -t +1\; select-window -t +1

    # Meta + h/l to cycle tabs.
    bind-key -n M-h previous-window
    bind-key -n M-l next-window

    # Ctrl + Meta + h/j/k/l to resize.
    bind-key -n C-M-h resize-pane -L 2
    bind-key -n C-M-j resize-pane -D 2
    bind-key -n C-M-k resize-pane -U 2
    bind-key -n C-M-l resize-pane -R 2

    # Smart pane switching aware of vim splits and fzf.
    # See: https://github.com/christoomey/vim-tmux-navigator
    # These are a fallback: if tmux.nvim is installed via tpm it rebinds the same
    # keys later in this file and wins.
    is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
    is_fzf="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"
    bind -n C-h run "($is_vim && tmux send-keys C-h) || tmux select-pane -L"
    bind -n C-j run "($is_vim && tmux send-keys C-j) || ($is_fzf && tmux send-keys C-j) || tmux select-pane -D"
    bind -n C-k run "($is_vim && tmux send-keys C-k) || ($is_fzf && tmux send-keys C-k) || tmux select-pane -U"
    bind -n C-l run "($is_vim && tmux send-keys C-l) || tmux select-pane -R"
    bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

    bind-key -T copy-mode-vi C-h select-pane -L
    bind-key -T copy-mode-vi C-j select-pane -D
    bind-key -T copy-mode-vi C-k select-pane -U
    bind-key -T copy-mode-vi C-l select-pane -R
    bind-key -T copy-mode-vi C-\\ select-pane -l

# Copy / paste.

    bind-key -T copy-mode-vi v send-keys -X begin-selection
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
    bind P paste-buffer

# Status bar.

    set -g status on
    set -g status-interval 5          # 1s wakes the CPU more than it's worth
    set -g status-justify left
    set -g status-position bottom
    # bg=default everywhere: let the terminal background show through rather
    # than painting blocks of colour.
    set -g status-style "bg=default"
    set -g status-left '#[fg=color14,bold]#S '
    set -g status-right '#[fg=color250] %Y-%m-%d #[fg=white,bold]%H:%M'
    set -g status-left-length 20
    set -g status-right-length 50

    setw -g window-status-format '#I#[fg=colour245]:#W#[fg=colour50]#F '
    setw -g window-status-current-format '#[fg=color250]#I#[fg=color245]:#[fg=color255,bold]#W#[fg=colour50]#F '

    set -g pane-border-style "fg=color238 bg=default"
    set -g pane-active-border-style "fg=green bg=default"
    set -g pane-border-status bottom
    set -g pane-border-format "#[fg=green] #{pane_index} #{@custom_pane_title}"
    bind < command-prompt -p "New Title: " -I "#{@custom_pane_title}" "set-option -p @custom_pane_title '%%'"

# Plugins (tpm).
#
# These must be declared BEFORE tpm runs; previously the plugins were invoked
# with bare `run` lines pointing at paths tpm had never installed, and the only
# @plugin declaration sat *after* `run tpm`, so it was ignored.

    set -g @plugin 'tmux-plugins/tpm'
    set -g @plugin 'tmux-plugins/tmux-sensible'
    set -g @plugin 'tmux-plugins/tmux-resurrect'
    set -g @plugin 'tmux-plugins/tmux-continuum'
    set -g @plugin 'tmux-plugins/tmux-yank'
    set -g @plugin 'tmux-plugins/tmux-copycat'
    set -g @plugin 'schasse/tmux-jump'
    set -g @plugin 'aserowy/tmux.nvim'

    # Session persistence across reboots.
    set -g @resurrect-capture-pane-contents 'on'
    set -g @resurrect-strategy-vim 'session'
    set -g @continuum-restore 'on'
    set -g @continuum-boot 'off'
    set -g @continuum-save-interval '15'

    # tmux.nvim navigation / resize.
    set -g @tmux-nvim-navigation true
    set -g @tmux-nvim-navigation-cycle true
    set -g @tmux-nvim-navigation-keybinding-left 'C-h'
    set -g @tmux-nvim-navigation-keybinding-down 'C-j'
    set -g @tmux-nvim-navigation-keybinding-up 'C-k'
    set -g @tmux-nvim-navigation-keybinding-right 'C-l'
    set -g @tmux-nvim-resize true
    set -g @tmux-nvim-resize-step-x 1
    set -g @tmux-nvim-resize-step-y 1
    set -g @tmux-nvim-resize-keybinding-left 'M-h'
    set -g @tmux-nvim-resize-keybinding-down 'M-j'
    set -g @tmux-nvim-resize-keybinding-up 'M-k'
    set -g @tmux-nvim-resize-keybinding-right 'M-l'

    # Keep last: tpm sources every declared plugin.
    # tpm lives under ~/.config/tmux/plugins because tpm is XDG-aware: with the
    # config at ~/.config/tmux/tmux.conf it installs plugins there, not in
    # ~/.tmux/plugins, so tpm itself is kept alongside them.
    run '~/.config/tmux/plugins/tpm/tpm'
